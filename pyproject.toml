[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "noshow_iq"
version = "0.1.0"
description = "NoShowIQ: No-show risk prediction API"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "NoShowIQ" }]
dependencies = [
  "pandas",
  "numpy",
  "scikit-learn",
  "joblib",
  "fastapi",
  "uvicorn[standard]",
  "pymongo",
  "python-dotenv",
]

[project.optional-dependencies]
dev = ["pytest", "httpx", "flake8"]

[project.scripts]
noshowiq-train = "noshow_iq.model:main"

[tool.setuptools]
packages = ["noshow_iq"]

[tool.setuptools.package-data]
noshow_iq = ["*.html"]

