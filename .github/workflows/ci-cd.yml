name: ci-cd

on:
  push:
    branches: ["main"]

jobs:
  ci-cd:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      IMAGE_NAME: noshow-iq-25279
      HF_SPACE_NAME: noshow-iq-25279
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Lint (flake8)
        run: flake8

      - name: Test (pytest)
        run: pytest -q

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest
            ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Resolve Hugging Face Space ID
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          
          token = os.environ["HF_TOKEN"]
          req = urllib.request.Request(
              "https://huggingface.co/api/whoami-v2",
              headers={"Authorization": f"Bearer {token}"},
          )
          with urllib.request.urlopen(req, timeout=30) as resp:
              data = json.loads(resp.read().decode("utf-8"))
          username = data.get("name") or data.get("user") or data.get("user_name")
          if not username:
              raise SystemExit(f"Could not resolve HF username from whoami-v2: {data}")
          
          space_id = f"{username}/{os.environ['HF_SPACE_NAME']}"
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
              f.write(f"HF_SPACE_ID={space_id}\n")
          
          print("HF_SPACE_ID", space_id)
          PY

      - name: Ensure Hugging Face Space exists
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python -m pip install --upgrade huggingface_hub
          python - <<'PY'
          import os
          from huggingface_hub import HfApi
          
          space_id = os.environ["HF_SPACE_ID"]
          token = os.environ["HF_TOKEN"]
          api = HfApi(token=token)
          
          # Create Space if missing (no-op if it already exists)
          api.create_repo(
              repo_id=space_id,
              repo_type="space",
              space_sdk="docker",
              exist_ok=True,
              private=False,
          )
          print("SPACE_OK", space_id)
          PY

      - name: Deploy to Hugging Face Space (git push)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          sudo apt-get update
          sudo apt-get install -y git-lfs
          git lfs install
          git fetch --prune --tags origin
          git checkout -f "${GITHUB_SHA}"
          git remote add hf "https://user:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE_ID}"
          git push hf HEAD:main --force

      - name: Trigger Hugging Face Space rebuild
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer ${HF_TOKEN}" \
            "https://huggingface.co/api/spaces/${HF_SPACE_ID}/restart"
